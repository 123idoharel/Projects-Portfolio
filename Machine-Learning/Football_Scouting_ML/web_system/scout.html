                          style={{ cursor:'pointer', color:sortKey==='peakCareer'?'var(--accent)':'var(--text3)', fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', userSelect:'none' }}>
                      Exp.Peak{sortKey==='peakCareer' ? (sortDir===-1?' ↓':' ↑') : ''}
                    </span>
                    <span title="Trend — ↑ shows displayed Career Peak's % above current value (≥5%). When peak.base falls ≥5% below current (decline guard), shows ↓ with the raw decline %. '—' otherwise."
                          onClick={() => handleSort('trend')}
                          style={{ cursor:'pointer', color:sortKey==='trend'?'var(--accent)':'var(--text3)', fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', userSelect:'none' }}>
                      Trend{sortKey==='trend' ? (sortDir===-1?' ↓':' ↑') : ''}
                    </span>
                    {isAttack ? (
                      <span title="Optimistic Career Peak — min(q75, smoothed q90), floored at career"
                            onClick={() => handleSort('optimistic')}
                            style={{ cursor:'pointer', color:sortKey==='optimistic'?'var(--accent)':'var(--text3)', fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', userSelect:'none' }}>
                        Opt.Peak{sortKey==='optimistic' ? (sortDir===-1?' ↓':' ↑') : ''}
                      </span>
                    ) : (
                      <>
                        <span title="Q75 — 75th-percentile career-peak forecast (raw)"
                              onClick={() => handleSort('rawQ75')}
                              style={{ cursor:'pointer', color:sortKey==='rawQ75'?'var(--accent)':'var(--text3)', fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', userSelect:'none' }}>
                          Q75{sortKey==='rawQ75' ? (sortDir===-1?' ↓':' ↑') : ''}
                        </span>
                        <span title="Q90 — 90th-percentile career-peak forecast (raw, no smoothing, no q75 cap)"
                              onClick={() => handleSort('rawOpt')}
                              style={{ cursor:'pointer', color:sortKey==='rawOpt'?'var(--accent)':'var(--text3)', fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', userSelect:'none' }}>
                          Q90{sortKey==='rawOpt' ? (sortDir===-1?' ↓':' ↑') : ''}
                        </span>
                      </>
                    )}
                    <span title={isAttack
                      ? "Optimistic Upside — Optimistic Career Peak / Current Value"
                      : "Q90 Upside — raw Q90 / Current Value"}
                          onClick={() => handleSort('optimisticUpside')}
                          style={{ cursor:'pointer', color:sortKey==='optimisticUpside'?'var(--accent)':'var(--text3)', fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', userSelect:'none' }}>
                      {isAttack ? 'Opt.Up' : 'Q90.Up'}{sortKey==='optimisticUpside' ? (sortDir===-1?' ↓':' ↑') : ''}
                    </span>
                    <span style={{ fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', color:'var(--text3)' }}
                          title="Optimistic Risk — confidence in the optimistic-peak forecast (interval width on the q90 band)">
                      Opt.Risk
                    </span>
                  </div>
                );
              })()}
              {/* Rows — calibrated */}
              <div style={{ overflowY:'auto', flex:1 }}>
                {displayPlayers.length === 0 && !apiLoading
                  ? <div style={{ padding:'80px 0', textAlign:'center', color:'var(--text3)', fontSize:14 }}>No players match current filters.</div>
                  : (<>
                      {displayPlayers.map((p, i) => <PlayerRowCalibrated key={p.id} player={p} rank={i+1} onClick={() => setSelected(p)} serverMode={serverMode}/>)}
                      {hiddenCount > 0 && (
                        <div style={{ padding:'18px 16px', textAlign:'center', color:'var(--text3)', fontSize:12, fontFamily:'var(--font-data)', borderTop:'1px dashed var(--border2)' }}>
                          Showing top <span style={{ color:'var(--text2)', fontWeight:700 }}>{DISPLAY_CAP}</span> of <span style={{ color:'var(--text2)', fontWeight:700 }}>{displayPlayersAll.length.toLocaleString()}</span> matches · narrow the filters to see more
                        </div>
                      )}
                    </>)
                }
              </div>
            </>
          ) : (
            <>
              {/* RAW — Column headers (raw + q75 column) */}
              <div style={{ display:'grid', gridTemplateColumns:'36px 1fr 60px 60px 92px 92px 96px 96px 96px 80px', padding:'0 18px', height:40, alignItems:'center', borderBottom:'1px solid var(--border)', background:'var(--surface)', flexShrink:0 }}>
                <span/>
                <ColH k="name"    label="Player"/>
                <span style={{ fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', color:'var(--text3)' }}>Pos</span>
                <ColH k="age"     label="Age"/>
                <ColH k="current" label="Value"/>
                <ColH k="next1yr" label="+1 Season"/>
                <ColH k="peak"    label="Peak"/>
                <span title="Optimistic — raw q90 model output (untouched)"
                      onClick={() => handleSort('rawOpt')}
                      style={{ cursor:'pointer', color:sortKey==='rawOpt'?'var(--accent)':'var(--text3)', fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', userSelect:'none' }}>
                  Optimistic{sortKey==='rawOpt' ? (sortDir===-1?' ↓':' ↑') : ''}
                </span>
                <span title="Q75 — raw 75th-percentile from the trained q75 pipeline (capped at q90 by merge)"
                      onClick={() => handleSort('rawQ75')}
                      style={{ cursor:'pointer', color:sortKey==='rawQ75'?'var(--accent)':'var(--text3)', fontSize:11, fontWeight:700, letterSpacing:'.07em', textTransform:'uppercase', userSelect:'none' }}>
                  Q75{sortKey==='rawQ75' ? (sortDir===-1?' ↓':' ↑') : ''}
                </span>
                <ColH k="upside"  label="Upside"/>
              </div>
              {/* Rows — raw */}
              <div style={{ overflowY:'auto', flex:1 }}>
                {displayPlayers.length === 0 && !apiLoading
                  ? <div style={{ padding:'80px 0', textAlign:'center', color:'var(--text3)', fontSize:14 }}>No players match current filters.</div>
                  : (<>
                      {displayPlayers.map((p, i) => <PlayerRow key={p.id} player={p} rank={i+1} onClick={() => setSelected(p)} serverMode={serverMode}/>)}
                      {hiddenCount > 0 && (
                        <div style={{ padding:'18px 16px', textAlign:'center', color:'var(--text3)', fontSize:12, fontFamily:'var(--font-data)', borderTop:'1px dashed var(--border2)' }}>
                          Showing top <span style={{ color:'var(--text2)', fontWeight:700 }}>{DISPLAY_CAP}</span> of <span style={{ color:'var(--text2)', fontWeight:700 }}>{displayPlayersAll.length.toLocaleString()}</span> matches · narrow the filters to see more
                        </div>
                      )}
                    </>)
                }
              </div>
            </>
          )}
        </div>
      </div>

      {selected && (
        <PlayerProfile
          player={selected}
          onClose={() => setSelected(null)}
          photo={photos[selected.id] || null}
          onPhotoUpdate={onPhotoUpdate}
          serverMode={serverMode}
          system={system}
          allPlayers={players.length > 0 ? players : serverPlayers}
        />
      )}
    </div>
  );
}

// ─── DEBOUNCE HOOK ────────────────────────────────────────────────────────────
function useDebounce(value, delay) {
  const [dbVal, setDbVal] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setDbVal(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return dbVal;
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [view,       setView]       = useState('home');
  const [system,     setSystem]     = useState(() => {
    try { return localStorage.getItem('scout_system') || null; } catch (e) { return null; }
  });
  const [players,    setPlayers]    = useState([]);   // local-mode only
  const [photos,     setPhotos]     = useState({});
  const [serverMode, setServerMode] = useState(false);
  const [serverMeta, setServerMeta] = useState(null);
  const [autoLoad,   setAutoLoad]   = useState('idle');

  useEffect(() => {
    // Default area at boot. switchArea() may change this later when the user
    // clicks a non-Attack pitch area pill.
    if (typeof window !== 'undefined') window.__SCOUT_AREA = 'attack';
    setAutoLoad('loading');
    fetch('/api/meta')
      .then(r => { if (!r.ok) throw new Error('no server'); return r.json(); })
      .then(meta => {
        setServerMode(true);
        setServerMeta(meta);
        // For server mode, R comes from the meta endpoint when available,
        // else fall back to the JS default. Server's own R is computed on
        // its loaded JSON for filter/sort consistency.
        if (meta && typeof meta.opt_ref_scale_eur === 'number' && meta.opt_ref_scale_eur > 0) {
          // Set the cached scale on the JS side from server's value
          window.__OPT_REF_FROM_SERVER = meta.opt_ref_scale_eur;
        }
        setAutoLoad('done');

        // Boot scan: log per-area player counts to the browser console so
        // the user can see at a glance how many entries each area has and
        // how many were dropped during normalize (typically: missing name).
        // This iterates over meta.available_areas — which the server fills
        // in based on which final_players_db_*.json files it found.
        const areas = Array.isArray(meta.available_areas) ? meta.available_areas : ['attack'];
        console.info(`[Scout ML] Server has ${areas.length} pitch area${areas.length === 1 ? '' : 's'} loaded: ${areas.join(', ')}`);
        // Fire one meta probe per area, log each separately.
        Promise.all(areas.map(a =>
          a === meta.area
            ? Promise.resolve(meta)
            : fetch(`/api/meta?area=${a}`).then(r => r.ok ? r.json() : null).catch(() => null)
        )).then(metas => {
          for (const m of metas) {
            if (!m) continue;
            const skipped = m.skipped ?? 0;
            const raw     = m.raw_total ?? m.total;
            const colorLoaded = 'font-weight:700;color:#00c896';
            const colorReset  = 'font-weight:400;color:inherit';
            if (skipped > 0) {
              console.info(
                `[Scout ML] %c${m.area.padEnd(10)}%c %c${(m.total || 0).toLocaleString()}%c players · ${skipped.toLocaleString()} skipped (missing name) · ${raw.toLocaleString()} raw`,
                'font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#7eb0ff',
                colorReset, colorLoaded, colorReset
              );
            } else {
              console.info(
                `[Scout ML] %c${m.area.padEnd(10)}%c %c${(m.total || 0).toLocaleString()}%c players (clean load, no skips)`,
                'font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#7eb0ff',
                colorReset, colorLoaded, colorReset
              );
            }
          }
        });
      })
      .catch(() => {
        // No server. Probe sibling area files and log counts for each that exists.
        const areas = ['attack', 'midfield', 'defense', 'gk'];
        Promise.all(areas.map(a => {
          const file = a === 'attack' ? 'final_players_db.json' : `final_players_db_${a}.json`;
          return fetch(file)
            .then(r => r.ok ? r.json() : null)
            .then(raw => {
              if (!raw) return null;
              const entries = Array.isArray(raw) ? raw : Object.values(raw);
              const parsed  = entries.map(normalizePlayer).filter(Boolean);
              return { area: a, file, raw: entries.length, parsed: parsed.length };
            })
            .catch(() => null);
        })).then(results => {
          const present = results.filter(Boolean);
          if (present.length === 0) { setAutoLoad('none'); return; }
          console.info(`[Scout ML] Local mode — found ${present.length} pitch area file${present.length === 1 ? '' : 's'}:`);
          present.forEach(r => {
            const skipped = r.raw - r.parsed;
            const colorLoaded = 'font-weight:700;color:#00c896';
            const colorReset  = 'font-weight:400;color:inherit';
            const colorArea   = 'font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#7eb0ff';
            if (skipped > 0) {
              console.info(`[Scout ML] %c${r.area.padEnd(10)}%c %c${r.parsed.toLocaleString()}%c players · ${skipped.toLocaleString()} skipped · ${r.raw.toLocaleString()} raw`, colorArea, colorReset, colorLoaded, colorReset);
            } else {
              console.info(`[Scout ML] %c${r.area.padEnd(10)}%c %c${r.parsed.toLocaleString()}%c players (clean load, no skips)`, colorArea, colorReset, colorLoaded, colorReset);
            }
          });
          // Update pitchAreas to reflect what's actually available.
          const presentSet = new Set(present.map(r => r.area));
          window.__BOOT_PITCH_AREAS = presentSet;   // consumed by SearchPage to reconcile
          // Auto-load Attack if present, else the first available.
          const startup = present.find(r => r.area === 'attack') || present[0];
          if (startup) {
            const parsed = startup.area === 'attack'
              ? null  // re-fetch with normalize on the canonical path below
              : null;
            // Re-fetch + normalize the chosen startup area for the players state.
            fetch(startup.file).then(r => r.json()).then(raw => {
              const entries = Array.isArray(raw) ? raw : Object.values(raw);
              const arr = entries.map(normalizePlayer).filter(Boolean);
              if (arr.length > 0) {
                window.__SCOUT_AREA = startup.area;
                setPlayers(arr);
                computeOptimisticRefScale(arr);
                setAutoLoad('done');
              } else setAutoLoad('none');
            }).catch(() => setAutoLoad('none'));
          } else {
            setAutoLoad('none');
          }
        });
      });
  }, []);

  const handlePhotoUpdate = (id, url) => setPhotos(p => ({ ...p, [id]: url }));

  const handleEnter = (sys) => {
    setSystem(sys);
    try { localStorage.setItem('scout_system', sys); } catch (e) {}
    setView('search');
  };

  const handleHome = () => setView('home');

  return view === 'home'
    ? <HomePage onEnter={handleEnter} autoLoad={autoLoad} serverMode={serverMode}/>
    : <SearchPage
        players={players} setPlayers={setPlayers}
        onHome={handleHome}
        photos={photos} onPhotoUpdate={handlePhotoUpdate}
        serverMode={serverMode} setServerMode={setServerMode}
        serverMeta={serverMeta} setServerMeta={setServerMeta}
        autoLoad={autoLoad}
        system={system || 'raw'}
      />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
